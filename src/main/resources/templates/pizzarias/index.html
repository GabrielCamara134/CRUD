<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lista de Pizzarias</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{'/pizzarias/new'}"
       class="btn btn-primary float-end">
        Nova Pizzaria
    </a>

    <h1>
        Lista de Pizzarias
        (<span th:text="${size}">0</span>)
    </h1>

    <hr>

    <table class="table">

        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">CNPJ</th>
            <th scope="col">Telefone</th>
            <th scope="col">E-mail</th>
            <th scope="col">Endereço</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="pizzaria : ${Pizzaria}">

            <th scope="row"
                th:text="${pizzaria.id}">
                1
            </th>

            <td th:text="${pizzaria.nome}">
                Pizzaria Exemplo
            </td>

            <td th:text="${pizzaria.cnpj}">
                00.000.000/0001-00
            </td>

            <td th:text="${pizzaria.telefone}">
                (84) 99999-9999
            </td>

            <td th:text="${pizzaria.email}">
                pizzaria@email.com
            </td>

            <td th:text="${pizzaria.endereco}">
                Rua Exemplo, 123
            </td>

            <td>

                <a th:href="@{|/pizzarias/show/${pizzaria.id}|}"
                   class="btn btn-danger">
                    Detalhes
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVwcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
