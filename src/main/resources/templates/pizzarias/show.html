<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalhes da Pizzaria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{'/pizzarias/index'}"
       class="btn btn-primary float-end">
        Voltar
    </a>

    <h1>
        Detalhes da Pizzaria
    </h1>

    <hr>

    <!-- ID -->
    <div class="mb-3">
        <label class="form-label">
            ID
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getId()}"
               disabled>
    </div>

    <!-- Nome -->
    <div class="mb-3">
        <label class="form-label">
            Nome da Pizzaria
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getNome()}"
               disabled>
    </div>

    <!-- CNPJ -->
    <div class="mb-3">
        <label class="form-label">
            CNPJ
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getCnpj()}"
               disabled>
    </div>

    <!-- Telefone -->
    <div class="mb-3">
        <label class="form-label">
            Telefone
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getTelefone()}"
               disabled>
    </div>

    <!-- E-mail -->
    <div class="mb-3">
        <label class="form-label">
            E-mail
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getEmail()}"
               disabled>
    </div>

    <!-- Endereço -->
    <div class="mb-3">
        <label class="form-label">
            Endereço
        </label>

        <input type="text"
               class="form-control"
               th:value="${pizzaria.getEndereco()}"
               disabled>
    </div>

    <!-- Editar -->
    <a th:href="@{|/pizzarias/edit/${pizzaria.id}|}"
       class="btn btn-warning">
        Editar
    </a>

    <!-- Excluir -->
    <a th:href="@{|/pizzarias/delete/${pizzaria.id}|}"
       class="btn btn-danger"
       onclick="return confirm('Tem certeza que deseja excluir esta pizzaria?')">
        Excluir
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
