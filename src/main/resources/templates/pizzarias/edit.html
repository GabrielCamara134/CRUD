<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.w3.org/1999/xhtml"
      data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Pizzaria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{'/pizzarias/index'}"
       class="btn btn-primary float-end">
        Voltar
    </a>

    <h1>
        Editar Pizzaria
        (<span th:text="${pizzaria.getNome()}"></span>)
    </h1>

    <hr>

    <form method="post"
          th:action="@{|/pizzarias/update/${pizzaria.id}|}"
          th:object="${pizzaria}">

        <input th:if="${pizzaria.id != null}"
               type="hidden"
               name="_method"
               value="put" />

        <!-- Nome -->
        <div class="mb-3">
            <label for="nome" class="form-label">
                Nome da Pizzaria
            </label>

            <input type="text"
                   class="form-control"
                   id="nome"
                   name="nome"
                   th:field="*{nome}">
        </div>

        <!-- CNPJ -->
        <div class="mb-3">
            <label for="cnpj" class="form-label">
                CNPJ
            </label>

            <input type="text"
                   class="form-control"
                   id="cnpj"
                   name="cnpj"
                   th:field="*{cnpj}">
        </div>

        <!-- Telefone -->
        <div class="mb-3">
            <label for="telefone" class="form-label">
                Telefone
            </label>

            <input type="text"
                   class="form-control"
                   id="telefone"
                   name="telefone"
                   th:field="*{telefone}">
        </div>

        <!-- E-mail -->
        <div class="mb-3">
            <label for="email" class="form-label">
                E-mail
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   th:field="*{email}">
        </div>

        <!-- Endereço -->
        <div class="mb-3">
            <label for="endereco" class="form-label">
                Endereço
            </label>

            <input type="text"
                   class="form-control"
                   id="endereco"
                   name="endereco"
                   th:field="*{endereco}">
        </div>

        <button type="submit"
                class="btn btn-primary">
            Salvar Alterações
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
