<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Detalhes do Animatronic</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{/animatronics/index}"
       class="btn btn-primary float-end">
        Voltar
    </a>

    <h1>Detalhes do Animatronic</h1>

    <hr>

    <div class="card">

        <div class="card-body">

            <h5 class="card-title"
                th:text="${animatronic.nome}">
                Nome
            </h5>

            <p class="card-text">
                <strong>ID:</strong>
                <span th:text="${animatronic.id}">
                    1
                </span>
            </p>

            <p class="card-text">
                <strong>Nome:</strong>
                <span th:text="${animatronic.nome}">
                    Freddy
                </span>
            </p>

            <p class="card-text">
                <strong>Peso:</strong>
                <span th:text="${animatronic.peso}">
                    100.0
                </span>
            </p>

            <p class="card-text">
                <strong>Cor:</strong>
                <span th:text="${animatronic.cor}">
                    Marrom
                </span>
            </p>

            <p class="card-text">
                <strong>Preço:</strong>
                R$
                <span th:text="${animatronic.preco}">
                    5000.0
                </span>
            </p>

            <a th:href="@{|/animatronics/edit/${animatronic.id}|}"
               class="btn btn-warning">
                Editar
            </a>
            <a th:href="@{|/animatronics/delete/${animatronic.id}|}"
               class="btn btn-secondary">
                Excluir
            </a>

            <a th:href="@{/animatronics/index}"
               class="btn btn-secondary">
                Voltar
            </a>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
